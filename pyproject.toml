[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bactromics-basis"
dynamic = ["version"]
description = "Bacterial Adaptive Safety Investigation System"
authors = [{name = "Jimi Goldstein"}]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["PyYAML>=6.0,<7", "snakemake==9.6.2"]

[project.urls]
Repository = "https://github.com/crackberryq/Bactomics_BaSIS"
Issues = "https://github.com/crackberryq/Bactomics_BaSIS/issues"
"Author ORCID" = "https://orcid.org/0000-0002-7829-0090"

[project.optional-dependencies]
workflow = ["snakemake==9.6.2"]
extend = ["numpy>=1.24,<3"]
excel = ["openpyxl==3.1.5", "et-xmlfile==2.0.0"]
ui = ["streamlit==1.55.0"]

[project.scripts]
basis = "basis.cli:main"

[tool.setuptools.packages.find]
include = ["basis*"]

[tool.setuptools.dynamic]
version = {attr = "basis.__version__"}

[tool.setuptools.package-data]
basis = ["resources/*", "resources/rules/*.smk", "resources/envs/*.yml", "resources/envs/*.yaml", "resources/profiles/*.yaml", "resources/motifs/*.json", "resources/placement/*.json", "resources/placement/*.faa", "resources/placement/*.txt", "resources/comparators/reviewed-v1/*", "resources/comparators/reviewed-v1/profiles/*.yaml"]
