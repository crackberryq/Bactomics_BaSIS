schema_version: 1
project: BaSIS study
samples: samples.tsv
outdir: results
validation_mode: research
execution:
  cores: 8
  memory_mb: 32000
  gpus: 0
modules:
  amrfinder:
    enabled: true
    mode: native
    executable: amrfinder
    command_prefix: []
    threads: 4
    memory_mb: 4000
    timeout_seconds: 14400
    cache: true
    database: /path/to/databases/amrfinder
    annotation_format: prokka
  rgi:
    enabled: true
    mode: native
    executable: rgi
    command_prefix: []
    threads: 4
    memory_mb: 4000
    timeout_seconds: 14400
    cache: true
    database: /path/to/databases/rgi
    include_loose: true
  vfdb:
    enabled: true
    mode: native
    executable: diamond
    command_prefix: []
    threads: 4
    memory_mb: 4000
    timeout_seconds: 14400
    cache: true
    database: /path/to/databases/vfdb
    min_identity: 80.0
    min_coverage: 70.0
    min_query_coverage: 0.0
    evalue: 1.0e-05
    max_target_seqs: 25
    sensitivity: sensitive
  antismash:
    enabled: true
    mode: native
    executable: antismash
    command_prefix: []
    threads: 4
    memory_mb: 12000
    timeout_seconds: 14400
    cache: true
    database: /path/to/databases/antismash
  genomad:
    enabled: true
    mode: native
    executable: genomad
    command_prefix: []
    threads: 4
    memory_mb: 12000
    timeout_seconds: 14400
    cache: true
    database: /path/to/databases/genomad
  mobsuite:
    enabled: true
    mode: native
    executable: mob_recon
    command_prefix: []
    threads: 4
    memory_mb: 4000
    timeout_seconds: 14400
    cache: true
    database: /path/to/databases/mobsuite
  integronfinder:
    enabled: true
    mode: native
    executable: integron_finder
    command_prefix: []
    threads: 4
    memory_mb: 4000
    timeout_seconds: 14400
    cache: true
  bacmet:
    enabled: false
    mode: native
    executable: diamond
    command_prefix: []
    threads: 4
    memory_mb: 4000
    timeout_seconds: 14400
    cache: true
    database: null
    min_identity: 80.0
    min_coverage: 70.0
    min_query_coverage: 0.0
    evalue: 1.0e-05
    max_target_seqs: 25
    sensitivity: sensitive
  isescan:
    enabled: false
    mode: native
    executable: isescan.py
    command_prefix: []
    threads: 4
    memory_mb: 4000
    timeout_seconds: 14400
    cache: true
  icescreen:
    enabled: false
    mode: native
    executable: icescreen
    command_prefix: []
    threads: 4
    memory_mb: 4000
    timeout_seconds: 14400
    cache: true
  crisprcasfinder:
    enabled: false
    mode: native
    executable: CRISPRCasFinder.pl
    command_prefix: []
    threads: 4
    memory_mb: 4000
    timeout_seconds: 14400
    cache: true
  minced:
    enabled: false
    mode: native
    executable: minced
    command_prefix: []
    threads: 4
    memory_mb: 4000
    timeout_seconds: 14400
    cache: true
  mlst:
    enabled: false
    mode: native
    executable: mlst
    command_prefix: []
    threads: 4
    memory_mb: 4000
    timeout_seconds: 14400
    cache: true
  pathogenfinder2:
    enabled: true
    mode: native
    executable: pathogenfinder2
    command_prefix: []
    threads: 4
    memory_mb: 16000
    timeout_seconds: 14400
    cache: true
    attention: true
    attention_top_n: 20
    map: false
    gpus: 0
    pf2_source_commit: 3837caf6710da5da3038f5d1246dd82ab26e003a
deep:
  profiles_dir: ../profiles
  reference_fasta: null
  reference_metadata: null
  reference_search_tool: blastp
  maximum_candidates: 100
  maximum_attention_candidates: 20
  maximum_exploratory_candidates: 20
  include_exploratory: true
  max_references: 40
  min_identity: 30
  min_coverage: 70
  phylogeny: true
  threads: 4
  memory_mb: 8000
  timeout_seconds: 14400
  command_prefix: []
  context_flank: 20000
  circular_contigs: []
