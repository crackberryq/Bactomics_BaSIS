name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install application and test dependencies
        run: python -m pip install setuptools wheel twine '.[ui,excel]'
      - name: Run software tests
        run: python -m unittest discover -s tests
      - name: Seal runtime manifest and build distributions
        run: python scripts/build_release.py
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Install the built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify installed wheel outside checkout
        working-directory: /tmp
        run: python -I -m basis verify-install
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python }}
          path: dist/

  real-conda-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        conda: ["25.9.1", "26.1.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: controller
        with:
          python-version: "3.11"
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          conda-version: ${{ matrix.conda }}
          channels: conda-forge
          activate-environment: ""
          auto-activate: false
      - name: Verify real Conda activation, native arguments, and target identity
        shell: bash -el {0}
        env:
          CONTROLLER_PYTHON: ${{ steps.controller.outputs.python-path }}
          EXPECTED_CONDA_VERSION: ${{ matrix.conda }}
        run: |
          "$CONTROLLER_PYTHON" scripts/check_conda_routing.py \
            --conda "$CONDA_EXE" --expected-conda-version "$EXPECTED_CONDA_VERSION"
