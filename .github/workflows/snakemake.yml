name: Standalone Snakemake acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test controller dependencies (no BaSIS package)
        run: python -m pip install -r requirements-test.txt
      - name: Verify direct workflow, failure recovery, and reporting with synthetic inputs
        run: python -m unittest discover -s tests -v

  report-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install report test dependencies
        run: python -m pip install -r requirements-test.txt 'playwright==1.64.1'
      - name: Exercise offline report search, pages, source fields, mobile and print
        env:
          BASIS_TEST_REPORT_BROWSER: '1'
          BASIS_REPORT_SCREENSHOT_DIR: report-browser-artifacts
        run: python -m unittest discover -s tests -p test_report_screening_browser.py -v
      - name: Preserve synthetic report screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readable-screening-report
          path: report-browser-artifacts/*.png

  real-conda-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        conda: ["25.9.1", "26.1.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: controller
        with:
          python-version: "3.11"
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: "25.9.1-0"
          conda-version: ${{ matrix.conda }}
          channels: conda-forge
          activate-environment: ""
          auto-activate: false
      - name: Install Snakemake test controller
        env:
          CONTROLLER_PYTHON: ${{ steps.controller.outputs.python-path }}
        run: '"$CONTROLLER_PYTHON" -m pip install "snakemake==9.6.2"'
      - name: Exercise genuine environment creation, incomplete deployment recovery, and failing post-deploy checks
        shell: bash -el {0}
        env:
          CONTROLLER_PYTHON: ${{ steps.controller.outputs.python-path }}
        run: '"$CONTROLLER_PYTHON" scripts/check_environment_recovery.py --workdir acceptance-environment-recovery'
      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-recovery-conda-${{ matrix.conda }}
          path: |
            acceptance-environment-recovery/summary.json
            acceptance-environment-recovery/**/*.log

  publish:
    name: Publish checked BaSIS AWARE alpha
    needs: [workflow, report-browser, real-conda-deployment]
    if: github.repository == 'crackberryq/Bactomics_BaSIS' && github.ref == 'refs/heads/basis-aware' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: basis-aware-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publish the exact tested source as an immutable alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
