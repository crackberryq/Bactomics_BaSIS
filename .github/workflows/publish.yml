name: Build and optionally publish
on:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish built distributions to TestPyPI (configure trusted publisher first)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install setuptools wheel twine '.[ui,excel]'
      - run: python -m unittest discover -s tests
      - run: python scripts/build_release.py
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  testpypi:
    if: inputs.publish_testpypi
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Require an explicit license before public publication
        run: test -s LICENSE
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
