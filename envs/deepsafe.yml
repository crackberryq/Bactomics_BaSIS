# Native tools and the Python runtime used for checked executable probes.
# Workflow helper code is used directly from this source checkout.
name: basis-deepsafe
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - epa-ng>=0.3.4,<0.4
  - mafft>=7,<8
  - iqtree>=2,<3
  - blast>=2.15,<3
  - hmmer>=3.3,<4
  - seqkit>=2,<3
  - pftools=3
  - perl
